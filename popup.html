<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meeting Copilot</title>

  <style>
    body {
      margin: 0;
      width: 420px;
      min-height: 500px;
      font-family: system-ui, sans-serif;
      background: #111318;
      color: #f5f5f5;
    }

    header {
      padding: 16px;
      border-bottom: 1px solid #2a2d35;
    }

    h1 {
      margin: 0;
      font-size: 18px;
    }

    #status {
      margin-top: 6px;
      font-size: 13px;
      color: #9ee6b0;
    }

    #summary {
      padding: 10px 16px;
      font-size: 13px;
      color: #aaa;
      border-bottom: 1px solid #2a2d35;
    }

    #transcript {
      max-height: 430px;
      overflow-y: auto;
      padding: 10px 16px;
    }

    .item {
      padding: 10px 0;
      border-bottom: 1px solid #262932;
    }

    .meta {
      font-size: 11px;
      color: #999;
      margin-bottom: 4px;
    }

    .speaker {
      font-weight: 700;
      color: #d6dcff;
    }

    .text {
      font-size: 14px;
      line-height: 1.4;
    }

    footer {
      padding: 12px 16px;
      border-top: 1px solid #2a2d35;
    }

    button {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    #empty {
      color: #888;
      padding: 30px 0;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>Meeting Copilot</h1>
  <div id="status">● Monitorando Teams</div>
</header>

<div id="summary">
  Carregando histórico...
</div>

<div id="transcript"></div>

<footer>
  <button id="clear">Limpar histórico</button>
</footer>

<script src="popup.js"></script>

</body>
</html>
